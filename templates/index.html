<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Risk Assessment</title>
    <!-- Vintage textbook typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --arterial-red: #c92a2a;
            --venous-blue: #1864ab;
            --paper-white: #faf9f6;
            --text-dark: #212529;
            --border-light: #dee2e6;
            --muted-text: #6c757d;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--paper-white);
            color: var(--text-dark);
            font-family: 'Inter', sans-serif;
            background-image: radial-gradient(#e5e5e5 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: #ffffff;
            border-top: 6px solid var(--arterial-red);
            border-bottom: 6px solid var(--venous-blue);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            padding: 40px 60px;
            border-radius: 4px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-light);
            position: relative;
        }

        /* Decorative anatomical line */
        header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 3px;
            background: linear-gradient(90deg, var(--arterial-red) 50%, var(--venous-blue) 50%);
        }

        h1 {
            font-family: 'Crimson Text', serif;
            font-size: 2.8rem;
            color: var(--arterial-red);
            margin: 0 0 10px 0;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-family: 'Crimson Text', serif;
            font-style: italic;
            color: var(--muted-text);
            font-size: 1.2rem;
            margin: 0;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: var(--venous-blue);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            padding: 12px 16px;
            border: 1px solid var(--border-light);
            border-radius: 4px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            background-color: var(--paper-white);
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--arterial-red);
            box-shadow: 0 0 0 3px rgba(201, 42, 42, 0.1);
        }

        .section-title {
            grid-column: 1 / -1;
            font-family: 'Crimson Text', serif;
            font-size: 1.5rem;
            color: var(--text-dark);
            margin: 20px 0 0 0;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--border-light);
        }

        .submit-btn {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, var(--arterial-red) 0%, #a61e1e 100%);
            color: white;
            border: none;
            padding: 16px 24px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(201, 42, 42, 0.2);
        }

        #result-container {
            display: none;
            grid-column: 1 / -1;
            margin-top: 30px;
            padding: 24px;
            border-radius: 4px;
            text-align: center;
            font-family: 'Crimson Text', serif;
            font-size: 1.5rem;
            animation: fadeIn 0.5s ease;
        }

        .result-positive {
            background-color: rgba(201, 42, 42, 0.1);
            border-left: 4px solid var(--arterial-red);
            color: var(--arterial-red);
        }

        .result-negative {
            background-color: rgba(24, 100, 171, 0.1);
            border-left: 4px solid var(--venous-blue);
            color: var(--venous-blue);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Retro textbook diagram aesthetic */
        .diagram-hint {
            grid-column: 1 / -1;
            font-size: 0.85rem;
            color: var(--muted-text);
            text-align: center;
            font-style: italic;
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            form { grid-template-columns: 1fr; }
            .container { padding: 30px; margin: 20px; }
            h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Clinical Assessment</h1>
        <p class="subtitle">Figure 1.1: Predictive Analysis of Cardiovascular Health</p>
    </header>

    <form id="prediction-form">
        <!-- Patient Information -->
        <h3 class="section-title">I. Patient Demographics</h3>
        
        <div class="form-group">
            <label for="age">Age (Years)</label>
            <input type="number" id="age" name="age" required min="1" max="120" placeholder="e.g. 52">
        </div>
        
        <div class="form-group">
            <label for="sex">Biological Sex</label>
            <select id="sex" name="sex" required>
                <option value="" disabled selected>Select</option>
                <option value="1">Male (1)</option>
                <option value="0">Female (0)</option>
            </select>
        </div>

        <!-- Symptoms & Observations -->
        <h3 class="section-title">II. Symptoms & Observations</h3>
        
        <div class="form-group">
            <label for="cp">Chest Pain Type</label>
            <select id="cp" name="cp" required>
                <option value="" disabled selected>Select type (0-3)</option>
                <option value="0">Typical Angina (0)</option>
                <option value="1">Atypical Angina (1)</option>
                <option value="2">Non-anginal Pain (2)</option>
                <option value="3">Asymptomatic (3)</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="exang">Exercise Induced Angina</label>
            <select id="exang" name="exang" required>
                <option value="" disabled selected>Select</option>
                <option value="1">Yes (1)</option>
                <option value="0">No (0)</option>
            </select>
        </div>

        <!-- Clinical Measurements -->
        <h3 class="section-title">III. Clinical Measurements</h3>
        
        <div class="form-group">
            <label for="trestbps">Resting Blood Pressure (mm Hg)</label>
            <input type="number" id="trestbps" name="trestbps" required placeholder="e.g. 125">
        </div>
        
        <div class="form-group">
            <label for="chol">Serum Cholestoral (mg/dl)</label>
            <input type="number" id="chol" name="chol" required placeholder="e.g. 212">
        </div>
        
        <div class="form-group">
            <label for="fbs">Fasting Blood Sugar > 120 mg/dl</label>
            <select id="fbs" name="fbs" required>
                <option value="" disabled selected>Select</option>
                <option value="1">True (1)</option>
                <option value="0">False (0)</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="restecg">Resting ECG Results</label>
            <select id="restecg" name="restecg" required>
                <option value="" disabled selected>Select result (0-2)</option>
                <option value="0">Normal (0)</option>
                <option value="1">ST-T Wave Abnormality (1)</option>
                <option value="2">Left Ventricular Hypertrophy (2)</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="thalach">Maximum Heart Rate Achieved</label>
            <input type="number" id="thalach" name="thalach" required placeholder="e.g. 168">
        </div>

        <!-- Advanced Diagnostics -->
        <h3 class="section-title">IV. Advanced Diagnostics</h3>
        
        <div class="form-group">
            <label for="oldpeak">ST Depression (Oldpeak)</label>
            <input type="number" step="0.1" id="oldpeak" name="oldpeak" required placeholder="e.g. 1.0">
        </div>
        
        <div class="form-group">
            <label for="slope">Slope of Peak Exercise ST Segment</label>
            <select id="slope" name="slope" required>
                <option value="" disabled selected>Select slope (0-2)</option>
                <option value="0">Upsloping (0)</option>
                <option value="1">Flat (1)</option>
                <option value="2">Downsloping (2)</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="ca">Number of Major Vessels Colored by Flourosopy</label>
            <select id="ca" name="ca" required>
                <option value="" disabled selected>Select (0-4)</option>
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="thal">Thalassemia (Thal)</label>
            <select id="thal" name="thal" required>
                <option value="" disabled selected>Select (0-3)</option>
                <option value="0">Normal (0)</option>
                <option value="1">Fixed Defect (1)</option>
                <option value="2">Reversable Defect (2)</option>
                <option value="3">Other (3)</option>
            </select>
        </div>

        <button type="submit" class="submit-btn" id="submit-btn">Run Diagnostic Protocol</button>
        
        <div id="result-container">
            <strong id="result-text"></strong>
        </div>

        <p class="diagram-hint">* See Appendix B for methodology regarding Random Forest classification thresholds.</p>
    </form>
</div>

<script>
    document.getElementById('prediction-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submit-btn');
        const resultContainer = document.getElementById('result-container');
        const resultText = document.getElementById('result-text');
        
        // Show loading state
        submitBtn.textContent = 'Processing Data...';
        submitBtn.disabled = true;
        resultContainer.style.display = 'none';
        
        // Gather data
        const formData = new FormData(e.target);
        const data = {};
        formData.forEach((value, key) => {
            data[key] = Number(value); // API expects numbers
        });

        try {
            const response = await fetch('/predict', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });
            
            const result = await response.json();
            
            if (response.ok) {
                resultText.textContent = "Diagnosis: " + result.prediction;
                
                // Style based on result
                if (result.prediction.includes("No Heart Disease")) {
                    resultContainer.className = "result-negative";
                } else {
                    resultContainer.className = "result-positive";
                }
                
                resultContainer.style.display = 'block';
            } else {
                resultText.textContent = "Error: " + (result.error || "Failed to get prediction");
                resultContainer.className = "result-positive"; // red color for error
                resultContainer.style.display = 'block';
            }
        } catch (error) {
            resultText.textContent = "Connection Error: Could not reach the server.";
            resultContainer.className = "result-positive";
            resultContainer.style.display = 'block';
        } finally {
            submitBtn.textContent = 'Run Diagnostic Protocol';
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
